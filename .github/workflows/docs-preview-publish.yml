name: Docs preview publish

# Trusted publisher for documentation PR previews. It must live on the default
# branch: GitHub reads workflow_run and schedule triggers from there. A copy on
# gh-pages is optional and only makes cleanup run immediately when a PR closes;
# otherwise the daily reconcile removes previews of closed PRs.
on:
  workflow_run:
    workflows: [Docs preview build]
    types: [completed]
  pull_request_target:
    branches: [gh-pages]
    types: [closed]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    permissions:
      contents: read
      actions: read
      pull-requests: write
    # Sandbox tracks develop so fixes merged in DiRoots.Public.Workflows apply
    # immediately. Production callers pin a reviewed tag or commit SHA.
    uses: DiRoots-Limited/DiRoots.Public.Workflows/.github/workflows/docs-preview-publish.yml@develop
    with:
      site-url: https://diroots-mauro.github.io/DiRoots.Sandbox.Releases
      app-id: ${{ vars.DOCS_PREVIEW_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.DOCS_PREVIEW_APP_PRIVATE_KEY }}
